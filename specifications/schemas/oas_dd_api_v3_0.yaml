---
openapi: 3.0.3
info:
  title: DD-API-V3 - Base schema
  description: Digitale Delta API V3
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  version: 3.0.0
paths:
  "/v3/odata/observations":
    description: Provides access to observations.
    get:
      tags:
        - Observation
      summary: Get entities from observations
      description: Get the observation data of the Digitale Delta API.
      operationId: observations.Observation.ListObservation
      parameters:
        - name: "$top"
          in: query
          description: The maximum number of records to return.
          example: '10000'
          schema:
            maximum: 10000
            exclusiveMaximum: false
            minimum: 1
            exclusiveMinimum: false
            type: integer
        - name: "$skiptoken"
          in: query
          description: The skip token, used to retrieve the next page of data. Generated
            by the service.
          schema:
            type: string
        - name: "$filter"
          in: query
          description: Filter the results.
          schema:
            type: string
        - name: "$orderby"
          in: query
          description: Order the results by.
          schema:
            type: string
          example: ResultTime
        - name: "$expand"
          in: query
          description: Expands selected entities.
          schema:
            type: string
        - name: "$count"
          in: query
          description: Include count.
          schema:
            type: boolean
          example: 'false'
        - name: "$select"
          in: query
          description: Select the properties to return.
          schema:
            type: string
      responses:
        '200':
          "$ref": "#/components/responses/DigitaleDelta.ObservationCollectionResponse"
        default:
          "$ref": "#/components/responses/error"
  "/v3/odata/references":
    description: Provides access to resources.
    get:
      tags:
        - Reference
      summary: Get entities from references
      description: Get the reference data of the Digitale Delta API.
      operationId: references.Reference.ListReference
      parameters:
        - name: "$top"
          in: query
          description: The maximum number of records to return.
          schema:
            maximum: 10000
            exclusiveMaximum: false
            minimum: 1
            exclusiveMinimum: false
            type: integer
          example: '10000'
        - name: "$skiptoken"
          in: query
          description: The skip token, used to retrieve the next page of data. Generated
            by the service.
          schema:
            type: string
        - name: "$filter"
          in: query
          description: Filter the results.
          schema:
            type: string
        - name: "$orderby"
          in: query
          description: Order the results by.
          schema:
            type: string
          example: Code
        - name: "$expand"
          in: query
          description: Expands selected entities.
          schema:
            type: string
        - name: "$count"
          in: query
          description: Include count.
          schema:
            type: boolean
          example: 'false'
        - name: "$select"
          in: query
          description: Select the properties to return.
          schema:
            type: string
      responses:
        '200':
          "$ref": "#/components/responses/DigitaleDelta.ReferenceCollectionResponse"
        default:
          "$ref": "#/components/responses/error"
components:
  schemas:
    DigitaleDelta.Reference:
      title: Reference
      type: object
      description: A reference is an entity to which observations can refer.
      properties:
        Id:
          type: string
          description: Unique ID of the reference.
        Type:
          type: string
          nullable: true
          description: Type of the reference
        Organisation:
          type: string
          nullable: true
          description: Organisation responsible for the reference
        Code:
          type: string
          description: Code of the reference
        Geography:
          "$ref": "#/components/schemas/Edm.GeographyPoint"
        Description:
          type: string
          description: Short description of the reference
          # optional starts here
    DigitaleDelta.Foi:
      title: Feature of Interest
      description: Feature of Interest is scoped to the location in which sampling
        took place.
      type: object
      properties:
        Id:
          type: string
          description: Id of the Feature of Interest
        Code:
          type: string
          description: Code of the Feature of Interest
        Geography:
          "$ref": "#/components/schemas/Edm.GeographyPoint"
        Description:
          type: string
          description: Description of the Feature of Interest
    DigitaleDelta.Observation:
      title: Observation
      type: object
      description: Defines an observation. The type of the observation defines how
        the results are expressed.
      properties:
        Id:
          type: string
          description: Unique ID of the observation
        Type:
          type: string
          description: Type of the observation
        ResultTime:
          type: string
          format: date-time
        PhenomenonTime:
          "$ref": "#/components/schemas/DigitaleDelta.Tm_Period"
        ValidTime:
          "$ref": "#/components/schemas/DigitaleDelta.Tm_Period"
        Parameter:
          "$ref": "#/components/schemas/DigitaleDelta.ParameterContainer"
        Metadata:
          anyOf:
            - "$ref": "#/components/schemas/DigitaleDelta.MetadataContainer"
            - type: object
              nullable: true
  # optional start
        RelatedObservations:
          type: array
          items:
            "$ref": "#/components/schemas/DigitaleDelta.RelatedObservation"
          x-ms-navigationProperty: true
          description: Related observations
  # optional end
        Foi:
          anyOf:
            - "$ref": "#/components/schemas/DigitaleDelta.Foi"
            - type: object
              nullable: true
          x-ms-navigationProperty: true
          description: Feature of Interest
        Result:
          "$ref": "#/components/schemas/DigitaleDelta.Result"
    DigitaleDelta.RelatedObservation:
      allOf:
        - "$ref": "#/components/schemas/DigitaleDelta.Observation"
        - title: RelatedObservation
          type: object
          description: Defines a related observation
          properties:
            Role:
              type: string
              nullable: true
    DigitaleDelta.DqElement:
      title: DqElement
      type: object
      description: Quality assessment
    DigitaleDelta.ParameterContainer:
      title: ParameterContainer
      type: object
      properties:
        Parameter:
          type: string
          nullable: true
          example: Cl
          description: Parameter observed. Chemical, biological, physical
        Compartment:
          type: string
          nullable: true
          example: OW
          description: "(Water) compartment in which sampling was performed"
        Quantity:
          type: string
          nullable: true
          example: AANTL
          description: Quantity
        Organisation:
          type: string
          nullable: true
          description: "'Owner' of the data of sampling location"
        LimitSymbol:
          type: string
          nullable: true
          description: Limit symbol
          example: "<"
  # for optional properties start here. Must be defined in the official list!
      description: Defines the quantifiable references related to the observation
    DigitaleDelta.MetadataContainer:
      title: MetadataContainer
      type: object
      description: Non-quantifiable data
      #  properties are optional and start here. Must be defined in the official list!
    DigitaleDelta.Result:
      title: Result
      type: object
      properties:
        Id:
          type: string
          description: Unique ID of the result
        Truth:
          type: boolean
          nullable: true
          description: Truth observation. Can only result in true or false
        Count:
          oneOf:
            - type: integer
              format: int64
            - type: string
          nullable: true
          description: Count observation. No unit specified and the value can only
            be a integer value
        Measure:
          anyOf:
            - "$ref": "#/components/schemas/DigitaleDelta.Measure"
            - type: object
              nullable: true
          description: Result is expressed in a unit and a value
        Vocab:
          anyOf:
            - "$ref": "#/components/schemas/DigitaleDelta.CategoryVerb"
            - type: object
              nullable: true
          description: Result is expressed in a vocabulary
        Coverage:
          anyOf:
            - "$ref": "#/components/schemas/Coverage"
            - type: object
              nullable: true
          description: Result is expressed in a vocabulary
        Geography:
          "$ref": "#/components/schemas/Edm.Geography"
    DigitaleDelta.Measure:
      title: Measure
      type: object
      properties:
        Uom:
          type: string
          description: Unit of Measurement
        Value:
          oneOf:
            - type: number
              format: decimal
            - type: string
          description: Measured value
    DigitaleDelta.CategoryVerb:
      title: CategoryVerb
      type: object
      properties:
        Vocabulary:
          type: string
          description: Vocabulary
        Term:
          type: string
          description: Term within the vocabulary
    Edm.Geography:
      "$ref": "#/components/schemas/Edm.Geography"
    Edm.GeographyPoint:
      "$ref": "#/components/schemas/Edm.GeographyPoint"
    Edm.GeographyLineString:
      "$ref": "#/components/schemas/Edm.GeographyLineString"
    Edm.GeographyPolygon:
      "$ref": "#/components/schemas/Edm.GeographyPolygon"
    Edm.GeographyMultiPoint:
      "$ref": "#/components/schemas/Edm.GeographyMultiPoint"
    Edm.GeographyMultiLineString:
      "$ref": "#/components/schemas/Edm.GeographyMultiLineString"
    Edm.GeographyMultiPolygon:
      "$ref": "#/components/schemas/Edm.GeographyMultiPolygon"
    Edm.GeographyCollection:
      "$ref": "#/components/schemas/Edm.GeographyCollection"
    GeoJSON.position:
      minItems: 2
      type: array
      items:
        type: number
      description: Describes a geometric position (coordinate) in GeoJSON
    DigitaleDelta.ODataErrors.ODataError:
      required:
        - error
      type: object
      properties:
        error:
          "$ref": "#/components/schemas/DigitaleDelta.ODataErrors.MainError"
      description: Describes OData errors
    DigitaleDelta.ODataErrors.MainError:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
          nullable: true
        details:
          type: array
          items:
            "$ref": "#/components/schemas/DigitaleDelta.ODataErrors.ErrorDetails"
        innererror:
          "$ref": "#/components/schemas/DigitaleDelta.ODataErrors.InnerError"
    DigitaleDelta.ODataErrors.ErrorDetails:
      required:
        - code
        - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
          nullable: true
    DigitaleDelta.Tm_Period:
      type: object
      properties:
        BeginPosition:
          type: string
          format: date-time
        EndPosition:
          type: string
          format: date-time
    DigitaleDelta.ODataErrors.InnerError:
      type: object
      description: The structure of this object is service-specific
    ODataCountResponse:
      type: integer
      format: int32
    DigitaleDelta.ReferenceCollectionResponse:
      title: Collection of References
      type: object
      allOf:
        - "$ref": "#/components/schemas/BaseCollectionPaginationCountResponse"
        - type: object
          properties:
            value:
              type: array
              items:
                "$ref": "#/components/schemas/DigitaleDelta.Reference"
      example:
        "@odata.context": https://localhost:7071/v3/odata/$metadata#references
        value:
          - Id: 51417e37-b2f1-4a0f-94d5-ba26225b6565
            Type: Parameter
            Organisation: TWN
            Code: Hyperia galba
            Description: Hyperia galba
            TaxonRank: Species
            TaxonAuthors: "(Montagu, 1815)"
            TaxonStatusCode: '10'
        "@odata.nextLink": https://localhost:7071/v3/odata/references?$filter=contains(Code%2c++%27alba%27)&$top=1&$skip=1
    DigitaleDelta.ObservationCollectionResponse:
      title: Collection of Observation
      type: object
      allOf:
        - "$ref": "#/components/schemas/BaseCollectionPaginationCountResponse"
        - type: object
          properties:
            value:
              type: array
              items:
                "$ref": "#/components/schemas/DigitaleDelta.Observation"
    DigitaleDelta.RelatedObservationCollectionResponse:
      title: Collection of RelatedObservation
      type: object
      allOf:
        - "$ref": "#/components/schemas/BaseCollectionPaginationCountResponse"
        - type: object
          properties:
            value:
              type: array
              items:
                "$ref": "#/components/schemas/DigitaleDelta.RelatedObservation"
    DigitaleDelta.DqElementCollectionResponse:
      title: Collection of DigitaleDelta.DqElement
      type: object
      allOf:
        - "$ref": "#/components/schemas/BaseCollectionPaginationCountResponse"
        - type: object
          properties:
            value:
              type: array
              items:
                "$ref": "#/components/schemas/DigitaleDelta.DqElement"
    StringCollectionResponse:
      title: Collection of string
      type: object
      allOf:
        - "$ref": "#/components/schemas/BaseCollectionPaginationCountResponse"
        - type: object
          properties:
            value:
              type: array
              items:
                type: string
    ReferenceNumeric:
      enum:
        - "-INF"
        - INF
        - NaN
    BaseCollectionPaginationCountResponse:
      title: Base collection pagination and count responses
      type: object
      properties:
        "@odata.count":
          type: integer
          format: int64
          nullable: true
        "@odata.nextLink":
          type: string
          nullable: true
          description: URL to retrieve the next page of results
    Coverage:
      type: object
      required:
        - type
        - domain
        - parameters
        - ranges
      properties:
        type:
          type: string
          enum: [ 'Coverage' ]
        domain:
          $ref: '#/components/schemas/Domain'
        parameters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Parameter'
        ranges:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Range'
    Domain:
      type: object
      required:
        - type
        - axes
      properties:
        type:
          type: string
          enum: [ 'Domain' ]
        axes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Axis'
        referencing:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
    Axis:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          items:
            oneOf:
              - type: number
              - type: string
        start:
          type: number
        stop:
          type: number
        num:
          type: integer
    Parameter:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        observedProperty:
          $ref: '#/components/schemas/ObservedProperty'
        unit:
          $ref: '#/components/schemas/Unit'
        categoryEncoding:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ObservedProperty:
      type: object
      properties:
        id:
          type: string
        label:
          type: object
          additionalProperties:
            type: string
        description:
          type: object
          additionalProperties:
            type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    Category:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        label:
          type: object
          additionalProperties:
            type: string
        description:
          type: object
          additionalProperties:
            type: string
    Unit:
      type: object
      properties:
        id:
          type: string
        label:
          type: object
          additionalProperties:
            type: string
        symbol:
          type: object
          additionalProperties:
            type: string
    Range:
      type: object
      required:
        - type
        - values
      properties:
        type:
          type: string
          enum: [ 'NdArray' ]
        dataType:
          type: string
          enum: [ 'float', 'integer', 'string' ]
        values:
          type: array
          items:
            oneOf:
              - type: number
              - type: string
              - type: array
        axisNames:
          type: array
          items:
            type: string
        shape:
          type: array
          items:
            type: integer
    Reference:
      type: object
      required:
        - system
      properties:
        system:
          type: string
        components:
          type: array
          items:
            type: string

  responses:
    error:
      description: error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/DigitaleDelta.ODataErrors.ODataError"
    ODataCountResponse:
      description: The count of the resource
      content:
        text/plain:
          schema:
            "$ref": "#/components/schemas/ODataCountResponse"
    DigitaleDelta.ReferenceCollectionResponse:
      description: Retrieved collection
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/DigitaleDelta.ReferenceCollectionResponse"
    DigitaleDelta.ObservationCollectionResponse:
      description: Retrieved collection
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/DigitaleDelta.ObservationCollectionResponse"
    DigitaleDelta.RelatedObservationCollectionResponse:
      description: Retrieved collection
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/DigitaleDelta.RelatedObservationCollectionResponse"
    DigitaleDelta.DqElementCollectionResponse:
      description: Retrieved collection
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/DigitaleDelta.DqElementCollectionResponse"
  parameters:
    top:
      name: "$top"
      in: query
      description: Show only the first n items
      style: form
      explode: false
      schema:
        minimum: 0
        type: integer
      examples:
        simple:
          value: 1
    skip:
      name: "$skip"
      in: query
      description: Skip the first n items
      style: form
      explode: false
      schema:
        minimum: 0
        type: integer
    count:
      name: "$count"
      in: query
      description: Include count of items
      style: form
      explode: false
      schema:
        type: boolean
    filter:
      name: "$filter"
      in: query
      description: Filter items by property values
      style: form
      explode: false
      schema:
        type: string
  headers:
    API-Version:
      description: The version of the API.
      required: true
      schema:
        type: string
      examples:
        simple:
          value: 1.0.0
    API-Deprecation-Date:
      description: The date that the API will be deprecated.
      required: true
      schema:
        type: string
        format: date
    API-End-of-Life-Date:
      description: The date that the API will be end-of-life.
      required: true
      schema:
        type: string
        format: date
    API-Next-Release:
      description: Next release version of the API.
      required: true
      schema:
        type: string
    API-Additional-Documentation:
      description: URL describing additional documentation, such as access.
      required: true
      schema:
        type: string
        format: uri
tags:
  - name: Reference
  - name: Observation
